[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/stats"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Mount a Railway Volume at /app/data so WA session survives restarts
# Create the volume in Railway dashboard → your service → Volumes → Mount at /app/data
[[mounts]]
mountPath = "/app/data"
